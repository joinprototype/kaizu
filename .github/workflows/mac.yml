name: Mac build and tests

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop, master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run Swift tests
        run: swift test
      - name: Build release app
        run: make app CONFIG=release
      - name: Verify app bundle
        run: codesign --verify --strict build/Kaizu.app
      - name: Package the verified app for launch testing
        run: ditto -c -k --keepParent build/Kaizu.app "$RUNNER_TEMP/Kaizu.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: kaizu-runtime-check
          path: ${{ runner.temp }}/Kaizu.zip
          retention-days: 1

  launch-on-macos-15:
    needs: verify
    runs-on: macos-15
    timeout-minutes: 7
    strategy:
      fail-fast: false
      matrix:
        scenario: [clean-launch, upgrade-from-0.2.5, signed-update, extension-windows]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: kaizu-runtime-check
          path: ${{ runner.temp }}
      - name: Unpack the candidate
        run: |
          sw_vers
          ditto -x -k "$RUNNER_TEMP/Kaizu.zip" "$RUNNER_TEMP/launch"
          codesign --verify --strict "$RUNNER_TEMP/launch/Kaizu.app"
      - name: Launch release and verify WebKit navigation
        if: matrix.scenario == 'clean-launch'
        run: python3 .github/scripts/check-release-launch.py "$RUNNER_TEMP/launch/Kaizu.app"
      - name: Upgrade the published app with a saved tab and login cookie
        if: matrix.scenario == 'upgrade-from-0.2.5'
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --location --retry 3 --output previous.zip https://github.com/joinprototype/kaizu/releases/download/v0.2.5/Kaizu-0.2.5.zip
          echo '709b3ecacfd26e73c7b8eb77d958e3ad57317833420b1f0d6d4698f5101ebc08  previous.zip' | shasum -a 256 --check
          ditto -x -k previous.zip installed
          codesign --verify --strict installed/Kaizu.app
          python3 "$GITHUB_WORKSPACE/.github/scripts/check-release-launch.py" launch/Kaizu.app installed/Kaizu.app
      - name: Check extension tab selection across two windows
        if: matrix.scenario == 'extension-windows'
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: python3 .github/scripts/check-release-launch.py "$RUNNER_TEMP/launch/Kaizu.app" --extension-windows
      - name: Install the production feed update on quit and restore the test login
        if: matrix.scenario == 'signed-update'
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: python3 .github/scripts/check-release-launch.py "$RUNNER_TEMP/launch/Kaizu.app" --signed-update
