name: Mac build and tests

on:
  workflow_dispatch:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop, master]
    paths-ignore:
      - 'docs/**/*.md'
      - 'README.md'
      - 'CHANGELOG.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Check changed files
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      needs_mac: ${{ steps.paths.outputs.needs_mac }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: paths
        run: |
          # Compare the PR's merge result with the exact base commit it was tested against.
          base=$(git rev-parse HEAD^1)
          if git diff --quiet --no-renames "$base" HEAD -- . ':(top,exclude,literal)README.md' ':(top,exclude,literal)CHANGELOG.md' ':(top,exclude,glob)docs/**/*.md'; then
            # Markdown uses trailing spaces for line breaks. Keep Git's conflict-marker check.
            git -c core.whitespace=-blank-at-eol diff --check "$base" HEAD
            echo "Documentation-only changes passed the Git diff check."
            echo "needs_mac=false" >> "$GITHUB_OUTPUT"
          else
            status=$?
            [[ "$status" == 1 ]] || exit "$status"
            echo "needs_mac=true" >> "$GITHUB_OUTPUT"
          fi

  verify:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.needs_mac == 'true') }}
    runs-on: xcode-27
    timeout-minutes: 20
    outputs:
      runtime_bundle_ready: ${{ steps.upload_runtime_bundle.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run Swift tests
        run: swift test
      - name: Verify Arc import Undo preserves later edits and profile cookies
        timeout-minutes: 4
        env:
          KAIZU_DEBUG: arcimport-undo-edits
          KAIZU_SUPPORT: ${{ runner.temp }}/arc-undo-profile
        run: |
          make app
          export KAIZU_ARC="$GITHUB_WORKSPACE/Tests/BrowserCoreTests/Fixtures/Arc Data Export.md"
          build/Kaizu.app/Contents/MacOS/Kaizu
          KAIZU_DEBUG=arcimport-undo-restored build/Kaizu.app/Contents/MacOS/Kaizu
      - name: Promote little windows in their original space and profile
        timeout-minutes: 2
        env:
          KAIZU_SUPPORT: ${{ runner.temp }}/little-window-profile
        run: |
          log="$RUNNER_TEMP/little-window.log"
          app="$GITHUB_WORKSPACE/build/Kaizu.app"
          open -n --env KAIZU_DEBUG=little-window-promotion --env "KAIZU_SUPPORT=$KAIZU_SUPPORT" --stderr "$log" -a "$app"
          # `open -W` fails with "No such process" when the app exits before open starts waiting.
          while pgrep -qf "$app/Contents/MacOS/Kaizu"; do sleep 0.5; done
          cat "$log"
          grep -Fxq 'Little-window promotion preserved the live page and its profile.' "$log"
      - name: Keep all four split panes when an extra pane is requested
        timeout-minutes: 2
        env:
          KAIZU_SUPPORT: ${{ runner.temp }}/split-capacity
          KAIZU_DEBUG: split-capacity
        run: build/Kaizu.app/Contents/MacOS/Kaizu
      - name: Recover an archive move after an interrupted session
        timeout-minutes: 3
        run: python3 .github/scripts/check-archive-recovery.py build/Kaizu.app/Contents/MacOS/Kaizu
      - name: Undo a bookmark import after deleting the folder in a second window
        timeout-minutes: 2
        env:
          KAIZU_DEBUG: bookmark-import-undo
          KAIZU_SUPPORT: ${{ runner.temp }}/bookmark-undo-profile
        run: build/Kaizu.app/Contents/MacOS/Kaizu
      - name: Keep per-site blocking changes inside their private window
        timeout-minutes: 2
        env:
          KAIZU_SUPPORT: ${{ runner.temp }}/private-blocking
        run: |
          log="$RUNNER_TEMP/private-blocking.log"
          app="$GITHUB_WORKSPACE/build/Kaizu.app"
          # Rendered pages in several windows need a launch through the window server.
          open -n --env KAIZU_DEBUG=private-blocking --env "KAIZU_SUPPORT=$KAIZU_SUPPORT" --stderr "$log" -a "$app"
          # `open -W` fails with "No such process" when the app exits before open starts waiting.
          while pgrep -qf "$app/Contents/MacOS/Kaizu"; do sleep 0.5; done
          cat "$log"
          grep -Fxq 'Verified regular and two private windows with independently rendered bundled and imported rules' "$log"
      - name: Route notification clicks after closing and restoring a work tab
        timeout-minutes: 2
        env:
          KAIZU_SUPPORT: ${{ runner.temp }}/notification-profile
        run: |
          KAIZU_DEBUG=notification-routing build/Kaizu.app/Contents/MacOS/Kaizu
          KAIZU_DEBUG=notification-routing-restored build/Kaizu.app/Contents/MacOS/Kaizu
      - name: Build release app
        run: |
          export KAIZU_UPDATE_KEY="$RUNNER_TEMP/test-update.key"
          public_key=$(swift scripts/update-sign.swift new "$KAIZU_UPDATE_KEY")
          version=$(plutil -extract CFBundleShortVersionString raw Resources/Info.plist)
          # The disposable signer belongs only to the rehearsal source tree.
          rehearsal="$RUNNER_TEMP/package-rehearsal"
          mkdir -p "$rehearsal"
          git archive HEAD | tar -x -C "$rehearsal"
          if "$rehearsal/scripts/release.sh" "$version" >"$RUNNER_TEMP/wrong-key.log" 2>&1; then
            echo "A foreign private key passed the release check" >&2
            exit 1
          fi
          grep -Fq 'does not match Kaizu' "$RUNNER_TEMP/wrong-key.log"
          printf 'public enum ReleaseUpdateKey { public static let base64 = "%s" }\n' "$public_key" > "$rehearsal/Sources/BrowserCore/ReleaseUpdateKey.swift"
          "$rehearsal/scripts/release.sh" "$version"

          # The bundle used by the production-feed and runtime checks retains the shipped verification key.
          make app CONFIG=release
          codesign --verify --strict build/Kaizu.app
          codesign -dvv build/Kaizu.app 2>&1 | grep -q 'flags=[^ ]*runtime'
          ditto -c -k --keepParent build/Kaizu.app "$RUNNER_TEMP/Kaizu.zip"
          mkdir -p "$RUNNER_TEMP/package-check/unpacked"
          ditto -x -k "$rehearsal/site/updates/Kaizu-$version.zip" "$RUNNER_TEMP/package-check/unpacked"
      - uses: actions/upload-artifact@v7
        id: upload_runtime_bundle
        with:
          name: kaizu-runtime-check
          path: ${{ runner.temp }}/Kaizu.zip
          if-no-files-found: error
          retention-days: 1
      - name: Install the loopback TURN relay
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install coturn
      - name: Verify a relayed WebRTC call in the packaged release
        timeout-minutes: 5
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          sw_vers
          .github/scripts/check-relayed-call.sh "$RUNNER_TEMP/package-check/unpacked/Kaizu.app"

  runtime:
    name: launch-on-${{ matrix.runner == 'xcode-27' && 'macos-27' || matrix.runner }} (${{ matrix.scenario }})
    needs: verify
    # The relay call has its own result. These checks require the verified bundle.
    if: ${{ !cancelled() && needs.verify.result != 'cancelled' && needs.verify.outputs.runtime_bundle_ready == 'true' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 7
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15]
        scenario: [clean-launch, upgrade-from-0.2.5, signed-update, extension-windows, media-call]
        # A release rehearsal repeats both installation paths on the current Mac.
        include: >-
          ${{ fromJSON(github.event_name == 'workflow_dispatch' &&
          '[{"runner":"xcode-27","scenario":"upgrade-from-0.2.5"},{"runner":"xcode-27","scenario":"signed-update"}]'
          || '[]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: kaizu-runtime-check
          path: ${{ runner.temp }}
      - name: Unpack the candidate
        run: |
          sw_vers
          ditto -x -k "$RUNNER_TEMP/Kaizu.zip" "$RUNNER_TEMP/launch"
          codesign --verify --strict "$RUNNER_TEMP/launch/Kaizu.app"
      - name: Reject a debug profile override before opening the release session
        if: matrix.scenario == 'clean-launch'
        run: |
          python3 - <<'PYTHON'
          import os
          import subprocess
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"])
          executable = root / "launch/Kaizu.app/Contents/MacOS/Kaizu"
          scratch = root / "rejected-profile"
          for override in (str(scratch), ""):
              result = subprocess.run([executable], env=dict(os.environ, KAIZU_SUPPORT=override),
                                      capture_output=True, text=True, timeout=10)
              if result.returncode != os.EX_CONFIG or "KAIZU_SUPPORT requires a debug build" not in result.stderr:
                  raise SystemExit(f"Expected a rejected release launch, got {result.returncode}: {result.stderr}")
          if scratch.exists():
              raise SystemExit("Rejected release launch created a profile")
          PYTHON
      - name: Launch release and verify WebKit navigation
        if: matrix.scenario == 'clean-launch'
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: python3 .github/scripts/check-release-launch.py "$RUNNER_TEMP/launch/Kaizu.app"
      - name: Upgrade the published app with a saved tab and login cookie
        if: matrix.scenario == 'upgrade-from-0.2.5'
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --location --retry 3 --output previous.zip https://github.com/joinprototype/kaizu/releases/download/v0.2.5/Kaizu-0.2.5.zip
          echo '709b3ecacfd26e73c7b8eb77d958e3ad57317833420b1f0d6d4698f5101ebc08  previous.zip' | shasum -a 256 --check
          ditto -x -k previous.zip installed
          codesign --verify --strict installed/Kaizu.app
          python3 "$GITHUB_WORKSPACE/.github/scripts/check-release-launch.py" launch/Kaizu.app installed/Kaizu.app
      - name: Verify audio, video and data transfer between WebRTC peers
        if: matrix.scenario == 'media-call'
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: python3 .github/scripts/check-release-launch.py "$RUNNER_TEMP/launch/Kaizu.app" --media-call
      - name: Check extension tab selection across two windows
        if: matrix.scenario == 'extension-windows'
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: python3 .github/scripts/check-release-launch.py "$RUNNER_TEMP/launch/Kaizu.app" --extension-windows
      - name: Install the production feed update on quit and restore the test login
        if: matrix.scenario == 'signed-update'
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: python3 .github/scripts/check-release-launch.py "$RUNNER_TEMP/launch/Kaizu.app" --signed-update
