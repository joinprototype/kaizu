name: Check new and edited drafts on immediate WebKit quit
on:
  push:
    branches: [qa/local-storage-at-ack]
permissions:
  contents: read
jobs:
  compare:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Quit directly on the page acknowledgement and compare committed writes
        run: |
          sw_vers
          python3 -u .github/qa/webkit-storage/check.py
