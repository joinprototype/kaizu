name: Compare WebKit local storage on quit
on:
  push:
    branches: [qa/plain-webkit-storage]
permissions:
  contents: read
jobs:
  compare:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Compare immediate quit with a confirmed commit
        run: |
          sw_vers
          python3 -u .github/qa/webkit-storage/check.py
