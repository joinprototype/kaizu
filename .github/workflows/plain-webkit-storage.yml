name: Compare draft preservation when a page exits on quit
on:
  push:
    branches: [qa/webkit-quit-navigation]
permissions:
  contents: read
jobs:
  compare:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, xcode-27]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Compare ordinary quit, completed navigation and a short commit interval
        run: |
          sw_vers
          python3 -u .github/qa/webkit-storage/check.py
