name: Compare relayed video encoders on one hosted Mac
on:
  push:
    branches: [qa/paired-video-encoders]
permissions:
  contents: read
  actions: read
jobs:
  compare:
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: 44388753876
          name: kaizu-runtime-check
          path: ${{ runner.temp }}/master
      - name: Build release app
        run: |
          export KAIZU_UPDATE_KEY="$RUNNER_TEMP/test-update.key"
          public_key=$(swift scripts/update-sign.swift new "$KAIZU_UPDATE_KEY")
          version=$(plutil -extract CFBundleShortVersionString raw Resources/Info.plist)
          # The disposable signer belongs only to the rehearsal source tree.
          rehearsal="$RUNNER_TEMP/package-rehearsal"
          mkdir -p "$rehearsal"
          git archive HEAD | tar -x -C "$rehearsal"
          if "$rehearsal/scripts/release.sh" "$version" >"$RUNNER_TEMP/wrong-key.log" 2>&1; then
            echo "A foreign private key passed the release check" >&2
            exit 1
          fi
          grep -Fq 'does not match Kaizu' "$RUNNER_TEMP/wrong-key.log"
          printf 'public enum ReleaseUpdateKey { public static let base64 = "%s" }\n' "$public_key" > "$rehearsal/Sources/BrowserCore/ReleaseUpdateKey.swift"
          "$rehearsal/scripts/release.sh" "$version"

          mkdir -p "$RUNNER_TEMP/package-check/unpacked"
          ditto -x -k "$rehearsal/site/updates/Kaizu-$version.zip" "$RUNNER_TEMP/package-check/unpacked"
      - name: Install the loopback TURN relay
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install coturn
      - name: Compare decoded video, audio and relay data in Kaizu and standard WebKit
        timeout-minutes: 14
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          ditto -x -k "$RUNNER_TEMP/master/Kaizu.zip" "$RUNNER_TEMP/reference"
          codesign --verify --deep --strict "$RUNNER_TEMP/reference/Kaizu.app"
          .github/scripts/check-relayed-call.sh "$RUNNER_TEMP/package-check/unpacked/Kaizu.app" "$RUNNER_TEMP/reference/Kaizu.app"
