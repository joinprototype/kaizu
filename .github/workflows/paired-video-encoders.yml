name: Compare automatic and user-initiated relayed H.264 calls
on:
  push:
    branches: [qa/relay-start-gesture]
permissions:
  contents: read
  actions: read
jobs:
  compare:
    runs-on: xcode-27
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: 44395517220
          name: kaizu-runtime-check
          path: ${{ runner.temp }}/candidate
      - name: Install the loopback TURN relay
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install coturn
      - name: Start the same call immediately, after a delay, and from a real click
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          ditto -x -k "$RUNNER_TEMP/candidate/Kaizu.zip" "$RUNNER_TEMP/install"
          codesign --verify --deep --strict "$RUNNER_TEMP/install/Kaizu.app"
          .github/scripts/check-relayed-call.sh "$RUNNER_TEMP/install/Kaizu.app"
