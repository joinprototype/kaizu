name: Trace v0.2.5 login cookies across a restart or upgrade
on:
  push:
    branches: [qa/merged-draft-upgrades]
permissions:
  contents: read
  actions: read
jobs:
  restore:
    runs-on: xcode-27
    timeout-minutes: 14
    strategy:
      fail-fast: false
      matrix:
        reader: [published, candidate]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: 44405191699
          name: kaizu-runtime-check
          path: ${{ runner.temp }}
      - name: Compare the first restored request with the committed cookies
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          READER: ${{ matrix.reader }}
        working-directory: ${{ runner.temp }}
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          sw_vers
          curl --fail --location --retry 3 --output previous.zip https://github.com/joinprototype/kaizu/releases/download/v0.2.5/Kaizu-0.2.5.zip
          echo '709b3ecacfd26e73c7b8eb77d958e3ad57317833420b1f0d6d4698f5101ebc08  previous.zip' | shasum -a 256 --check
          python3 -u "$GITHUB_WORKSPACE/.github/scripts/compare-cookie-restore.py"
