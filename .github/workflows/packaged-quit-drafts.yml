name: Inspect multi-window draft restore on macOS 15
on:
  push:
    branches: [qa/restore-window-observation]
permissions:
  contents: read
  actions: read
jobs:
  observe:
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: 44381819920
          name: quit-comparison
          path: ${{ runner.temp }}/packages
      - name: Check saved selection, database value, window state and first read
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          ditto -x -k "$RUNNER_TEMP/packages/candidate.zip" "$RUNNER_TEMP/install"
          codesign --verify --deep --strict "$RUNNER_TEMP/install/Kaizu.app"
          python3 -u .github/qa/quit-drafts/check.py "$RUNNER_TEMP/install/Kaizu.app"
