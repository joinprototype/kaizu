name: Restore drafts and tab histories in packaged Kaizu
on:
  push:
    branches: [qa/packaged-quit-drafts]
permissions:
  contents: read
jobs:
  build:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Package current and candidate quit handlers
        run: |
          git worktree add --detach "$RUNNER_TEMP/original" fa714b7ae6152304e11293c4990966d3303fef93
          make -C "$RUNNER_TEMP/original" app CONFIG=release
          make app CONFIG=release
          mkdir -p "$RUNNER_TEMP/packages"
          for variant in original candidate; do
            app="build/Kaizu.app"
            if [ "$variant" = original ]; then app="$RUNNER_TEMP/original/build/Kaizu.app"; fi
            codesign --verify --deep --strict "$app"
            ditto -c -k --keepParent "$app" "$RUNNER_TEMP/packages/$variant.zip"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: quit-comparison
          path: ${{ runner.temp }}/packages/*.zip
          retention-days: 1
  compare:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        variant: [original, candidate]
        runner: [macos-15, xcode-27]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: quit-comparison
          path: ${{ runner.temp }}/packages
      - name: Compare both profiles' first draft read and Back after Quit
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          VARIANT: ${{ matrix.variant }}
        run: |
          ditto -x -k "$RUNNER_TEMP/packages/$VARIANT.zip" "$RUNNER_TEMP/install"
          codesign --verify --deep --strict "$RUNNER_TEMP/install/Kaizu.app"
          python3 -u .github/qa/quit-drafts/check.py "$RUNNER_TEMP/install/Kaizu.app"
