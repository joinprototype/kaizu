name: Compare local storage across quits and upgrades
on:
  push:
    branches: [qa/upgrade-storage-trials]
permissions:
  contents: read
  actions: read
jobs:
  compare:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, xcode-27]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: kaizu-runtime-check
          run-id: 44340677064
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/candidate
      - name: Compare immediate quit and restore on fresh profiles
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/published.zip" https://github.com/joinprototype/kaizu/releases/download/v0.2.5/Kaizu-0.2.5.zip
          echo "709b3ecacfd26e73c7b8eb77d958e3ad57317833420b1f0d6d4698f5101ebc08  $RUNNER_TEMP/published.zip" | shasum -a 256 --check
          python3 -u .github/qa/upgrade-storage/compare.py
